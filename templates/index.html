        // 执行SQL
        let execSelectionUsed = false;
        async function executeSQL() {
            const sqlEl = document.getElementById('sqlInput');
            // 有选中文字时, 只执行选中部分
            const sel = sqlEl.value.substring(sqlEl.selectionStart, sqlEl.selectionEnd).trim();
            const sql = sel || sqlEl.value.trim();
            if (!sql) return;
            execSelectionUsed = !!sel;
            const tab = openTabs[activeTabIndex];
            // 识别主表, 结果包含完整主键列时允许双击编辑
            editCtx = tab ? await resolveEditCtx(tab.connId, sql) : null;
            await executeQuery(sql);
        }
        
        async function executeQuery(sql) {
            if (activeTabIndex < 0) {
                showToast('请先选择数据库连接', "info");
                return;
            }
            
            // 重新执行查询时清空待删除标记
            deletedRows = [];
            
            pushSqlHistory(sql);
            const tab = openTabs[activeTabIndex];
            
            try {
                const res = await fetch('/api/v1/query/execute', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        connectionId: tab.connId,
                        sql: sql
                    })
                });
                
                const data = await res.json();
                
                // 检查危险SQL
                if (data.dangerous) {
                    showConfirmModal(data.dangerMessage + '，确定要执行吗？', async () => {
                        await forceExecuteQuery(tab.connId, sql);
                    });
                    return;
                }
                
                if (data.success) {
                    if (data.type === 'query') {
                        renderQueryResult(data);
                    } else {
                        document.getElementById('resultContent').innerHTML = 
                            `<div class="message success">${data.message} (${data.executionMs}ms)</div>`;
                    }
                } else {
                    document.getElementById('resultContent').innerHTML = 
                        `<div class="message error">${data.error}</div>`;
                }
            } catch(e) {
                document.getElementById('resultContent').innerHTML = 
                    `<div class="message error">${e.message}</div>`;
            }
        }
        
        async function forceExecuteQuery(connId, sql) {
            try {
                const res = await fetch('/api/v1/query/force-execute', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ connectionId: connId, sql })
                });
                const data = await res.json();
                
                if (data.success) {
                    if (data.type === 'query') {
                        renderQueryResult(data);
                    } else {
                        document.getElementById('resultContent').innerHTML = 
                            `<div class="message success">${data.message} (${data.executionMs}ms)</div>`;
                    }
                } else {
                    document.getElementById('resultContent').innerHTML = 
                        `<div class="message error">${data.error}</div>`;
                }
            } catch(e) {
                document.getElementById('resultContent').innerHTML = 
                    `<div class="message error">${e.message}</div>`;
            }
        }
        
        // 显示插入数据对话框
        let sqlInsertTableName = '';
        function showInsertModal() {
            if (activeTabIndex < 0 || !editCtx || !editCtx.table) {
                showToast('请先选择一个表进行查询', "info");
                return;
            }
            sqlInsertTableName = editCtx.table;
            document.getElementById('sqlInsertTableName').textContent = sqlInsertTableName;
            document.getElementById('sqlInsertFields').innerHTML = '<div style="text-align:center;padding:20px;">加载中...</div>';
            document.getElementById('sqlInsertModal').classList.add('show');
            
            // 获取表结构
            fetch('/api/v1/metadata/table/describe?connectionId=' + editCtx.connId + '&table=' + encodeURIComponent(sqlInsertTableName))
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.success) {
                        var html = '';
                        data.columns.forEach(function(col) {
                            var colName = col.name || col.COLUMN_NAME || col.column_name || 'unknown';
                            var colType = col.type || col.DATA_TYPE || col.data_type || '';
                            // PostgreSQL: is_nullable = 'YES' or 'NO', MySQL: IS_NULLABLE = 'YES' or 'NO'
                            var isNullable = (col.is_nullable === 'YES' || col.is_nullable === 'yes' || col.IS_NULLABLE === 'YES' || col.IS_NULLABLE === 'yes' || col.is_nullable === true);
                            var requiredStar = isNullable ? '' : ' <span style="color:var(--danger-text);">*</span>';
                            html += '<div class="form-group" style="margin-bottom:8px;display:flex;align-items:center;gap:8px;">';
                            html += '<label style="min-width:80px;max-width:150px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + colName + '">' + colName + requiredStar + '</label>';
                            html += '<input type="text" id="insert_field_' + colName + '" data-column="' + colName + '" placeholder="' + colType + '" style="flex:1;min-width:0;padding:6px 8px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);">';
                            html += '</div>';
                        });
                        document.getElementById('sqlInsertFields').innerHTML = html;
                    } else {
                        document.getElementById('sqlInsertFields').innerHTML = '<div class="error">加载失败: ' + data.error + '</div>';
                    }
                });
        }
        
        function closeSqlInsertModal() {
            document.getElementById('sqlInsertModal').classList.remove('show');
        }
        
        function executeSqlInsert() {
            if (!sqlInsertTableName || !editCtx) return;
            
            var fields = [];
            var values = [];
            var inputs = document.querySelectorAll('#sqlInsertFields input');
            inputs.forEach(function(input) {
                var colName = input.dataset.column;
                var val = input.value.trim();
                if (val) {
                    fields.push(colName);
                    // 判断是否需要引号
                    if (val === 'NULL' || val.match(/^\d+(\.\d+)?$/) || val === 'true' || val === 'false') {
                        values.push(val);
                    } else {
                        values.push("'" + val.replace(/'/g, "''") + "'");
                    }
                }
            });
            
            if (fields.length === 0) {
                showToast('请至少填写一个字段', "info");
                return;
            }
            
            var dbType = (connections[editCtx.connId] || {}).db_type;
            var qt = dbType === 'mysql' ? '`' : '"';
            var sql = 'INSERT INTO ' + qt + sqlInsertTableName + qt + ' (' + fields.join(', ') + ') VALUES (' + values.join(', ') + ')';
            
            fetch('/api/v1/query/execute', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({connectionId: editCtx.connId, sql: sql})
            }).then(function(r) { return r.json(); }).then(function(data) {
                if (data.success) {
                    closeSqlInsertModal();
                    // 刷新当前查询
                    var sqlEl = document.getElementById('sqlInput');
                    executeQuery(sqlEl.value);
                    showToast('插入成功!', 'success');
                } else {
                    showToast('插入失败: ' + data.error, 'error');
                }
            });
        }
        
        // ==================== SQL输入框: Ctrl+Enter + 上下键历史 ====================
        let sqlHistory = [];      // 历史记录 (旧 -> 新)
        let histIdx = 0;          // 当前浏览位置, sqlHistory.length 表示草稿
        let histDraft = '';       // 未执行完的草稿
        const tablePks = {};      // 主键缓存: "connId:table" -> [pk列名]
        const tableColumns = {};  // 列名缓存: "connId:table" -> [列名]
        let editCtx = null;       // 当前结果是否可编辑: {connId, table, pkColumns}
        let lastResult = null;    // 最近一次查询结果 {columns, data}
        let deletedRows = [];    // 待删除的行索引列表

        const SQL_KEYWORDS = [
            'SELECT', 'FROM', 'WHERE', 'INSERT INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE FROM',
            'JOIN', 'LEFT JOIN', 'RIGHT JOIN', 'INNER JOIN', 'ON', 'AS', 'AND', 'OR', 'NOT',
            'NULL', 'IS NULL', 'IS NOT NULL', 'IN', 'LIKE', 'BETWEEN', 'DISTINCT',
            'ORDER BY', 'GROUP BY', 'HAVING', 'LIMIT', 'OFFSET', 'UNION', 'UNION ALL',
            'CASE WHEN', 'THEN', 'ELSE', 'END', 'COUNT(*)', 'COUNT', 'SUM', 'AVG', 'MIN', 'MAX',
            'ASC', 'DESC', 'DISTINCT ON', 'RETURNING', 'EXISTS', 'COMMIT', 'ROLLBACK'
        ];
        let sugItems = [], sugIdx = 0, sugTokenStart = 0;

        function pushSqlHistory(sql) {
            sql = (sql || '').trim();
            if (!sql) return;
            if (sqlHistory.length && sqlHistory[sqlHistory.length - 1] === sql) {
                histIdx = sqlHistory.length;
                return;
            }
            sqlHistory.push(sql);
            if (sqlHistory.length > 200) sqlHistory.shift();
            histIdx = sqlHistory.length;
        }

        async function seedSqlHistory(connId) {
            try {
                const res = await fetch(`/api/v1/query/history?connection_id=${connId}&limit=50`);
                const data = await res.json();
                if (data.success && Array.isArray(data.history)) {
                    const serverHist = data.history.map(h => h.sql_text).filter(Boolean).reverse();
                    sqlHistory = Array.from(new Set([...serverHist, ...sqlHistory]));
                    histIdx = sqlHistory.length;
                }
            } catch (e) { /* 历史加载失败不影响使用 */ }
        }

        function navigateHistory(dir) {
            if (sqlHistory.length === 0) return;
            const el = document.getElementById('sqlInput');
            if (histIdx === sqlHistory.length) histDraft = el.value;
            let idx = histIdx + dir;
            if (idx < 0) idx = 0;
            if (idx > sqlHistory.length) idx = sqlHistory.length;
            histIdx = idx;
            el.value = idx === sqlHistory.length ? histDraft : sqlHistory[idx];
            el.selectionStart = el.selectionEnd = el.value.length;
        }

        function sqlInputKeydown(e) {
            // Ctrl+Enter / Cmd+Enter 永远是执行, 优先级最高
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                executeSQL();
                return;
            }
            // 联想弹层打开时, 优先处理导航键
            const popup = document.getElementById('sqlSuggest');
            if (popup && popup.classList.contains('show') && sugItems.length) {
                if (e.key === 'ArrowDown') { e.preventDefault(); moveSuggest(1); return; }
                if (e.key === 'ArrowUp') { e.preventDefault(); moveSuggest(-1); return; }
                if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); acceptSuggestion(); return; }
                if (e.key === 'Escape') { e.preventDefault(); hideSuggestions(); return; }
            }
            // 上下键翻历史 (单行输入时, 或光标在首行/末行时)
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                const el = e.target;
                const pos = el.selectionStart;
                const before = el.value.slice(0, pos);
                const after = el.value.slice(el.selectionEnd);
                if (e.key === 'ArrowUp' && before.includes('\n')) return;
                if (e.key === 'ArrowDown' && after.includes('\n')) return;
                e.preventDefault();
                navigateHistory(e.key === 'ArrowUp' ? -1 : 1);
            }
        }

        function bindSqlInputEvents() {
            const el = document.getElementById('sqlInput');
            if (!el || el.dataset.bound) return;
            el.dataset.bound = '1';
            el.addEventListener('keydown', sqlInputKeydown);
            // 用户手动输入后清除"自动生成"标记, loadTableData 将尊重用户SQL
            el.addEventListener('input', () => { el.dataset.autoTable = ''; updateSuggestions(); });
            el.addEventListener('blur', () => setTimeout(hideSuggestions, 150));
            el.addEventListener('click', hideSuggestions);
            // 滚动时弹层跟随光标重新定位 (退格引发自动滚动时不闪烁)
            el.addEventListener('scroll', () => {
                const popup = document.getElementById('sqlSuggest');
                if (popup && popup.classList.contains('show')) positionSuggestPopup(el);
            });
            // 联想弹层
            const section = el.closest('.sql-section');
            if (section && !document.getElementById('sqlSuggest')) {
                const popup = document.createElement('div');
                popup.id = 'sqlSuggest';
                popup.className = 'sql-suggest';
                section.appendChild(popup);
            }
        }

        // ==================== SQL联想提示 ====================
        function hideSuggestions() {
            const popup = document.getElementById('sqlSuggest');
            if (popup) popup.classList.remove('show');
        }

        function moveSuggest(d) {
            if (!sugItems.length) return;
            sugIdx = (sugIdx + d + sugItems.length) % sugItems.length;
            renderSuggestList();
        }

        function renderSuggestList() {
            const popup = document.getElementById('sqlSuggest');
            popup.innerHTML = sugItems.map((it, i) =>
                `<div class="suggest-item ${i === sugIdx ? 'active' : ''}" onclick="acceptSuggestion(${i})" onmousedown="event.preventDefault()">${escapeHtml(it.name)}<span class="sug-type">${it.type}</span></div>`
            ).join('');
            const active = popup.querySelector('.suggest-item.active');
            if (active) active.scrollIntoView({ block: 'nearest' });
        }

        function acceptSuggestion(idx) {
            if (typeof idx === 'number') sugIdx = idx;
            const item = sugItems[sugIdx];
            hideSuggestions();
            if (!item) return;
            const el = document.getElementById('sqlInput');
            el.setRangeText(item.name, sugTokenStart, el.selectionStart, 'end');
        }

        function getCachedColumns(connId, tableName) {
            const key = connId + ':' + tableName;
            if (tableColumns[key]) return tableColumns[key];
            tableColumns[key] = [];  // 占位, 防止重复请求
            fetch(`/api/v1/metadata/table/describe?connectionId=${connId}&table=${encodeURIComponent(tableName)}`)
                .then(r => r.json())
                .then(data => {
                    if (data.success && Array.isArray(data.columns)) {
                        tableColumns[key] = data.columns.map(c => c.COLUMN_NAME || c.column_name);
                        updateSuggestions();  // 列信息到达后刷新弹层
                    }
                })
                .catch(() => {});
            return [];
        }

        // 光标前最后一个子句关键字, 用于判断列上下文/表上下文
        function lastClause(before) {
            const re = /\b(select|from|where|having|order\s+by|group\s+by|join|on|and|or|into|update|set|limit|offset|values|union)\b/gi;
            let last = null, m;
            while ((m = re.exec(before)) !== null) {
                last = m[1].toUpperCase().replace(/\s+/g, ' ');
            }
            return last;
        }

        // SQL 中已写出的主表 (FROM/JOIN/UPDATE/INTO 后的第一个表), 无则用当前选中表
        function findReferencedTable(before, tab) {
            const m = before.match(/\b(?:from|join|update|into)\s+["`]?([A-Za-z0-9_.]+)["`]?/i);
            if (!m) return tab.tableName || '';
            const parts = m[1].split('.');
            return parts[parts.length - 1];
        }

        function getSuggestCandidates(before, fullSql, tab) {
            const conn = activeConnections[tab.connId] || {};
            const tables = (conn.tables || []).map(n => ({ name: n, type: '表' }));
            const views = (conn.views || []).map(n => ({ name: n, type: '视图' }));
            const keywords = SQL_KEYWORDS.map(k => ({ name: k, type: '关键字' }));

            // 1. "表名." 或 "表名.前缀" → 建议该表的列
            const dot = before.match(/([A-Za-z0-9_"]+)\.([A-Za-z0-9_]*)$/);
            if (dot) {
                const tableName = dot[1].replace(/"/g, '');
                return getCachedColumns(tab.connId, tableName)
                    .filter(c => c.toLowerCase().startsWith(dot[2].toLowerCase()))
                    .map(c => ({ name: c, type: tableName + ' 列' }));
            }

            const m = before.match(/[A-Za-z0-9_]+$/);
            const token = m ? m[0] : '';
            const lower = token.toLowerCase();
            const filt = arr => arr.filter(it =>
                it.name.toLowerCase().startsWith(lower) && it.name.toLowerCase() !== lower);

            const clause = lastClause(before);

            // 2. 表上下文: FROM/JOIN/UPDATE/INTO 之后 → 表和视图
            if (['FROM', 'JOIN', 'UPDATE', 'INTO'].includes(clause)) {
                return filt(tables.concat(views));
            }
            // 3. 中性位置: LIMIT/OFFSET/VALUES/UNION 之后 → 不联想
            if (['LIMIT', 'OFFSET', 'VALUES', 'UNION'].includes(clause)) {
                return [];
            }
            // 4. 列上下文 (SELECT/WHERE/ORDER BY/GROUP BY/HAVING/ON/AND/OR/SET/语句开头):
            //    优先用整条语句中已输入的表名(含光标之后的FROM等)对应的字段; 没有表名则用当前选中表
            const refTable = findReferencedTable(fullSql, tab);
            const typeLabel = refTable ? ((refTable === tab.tableName ? '当前表' : refTable) + ' 列') : '列';
            const cols = refTable
                ? getCachedColumns(tab.connId, refTable).map(c => ({ name: c, type: typeLabel }))
                : [];
            return filt(cols.concat(keywords, token ? tables : []));
        }

        function updateSuggestions() {
            const el = document.getElementById('sqlInput');
            const popup = document.getElementById('sqlSuggest');
            if (!el || !popup) return;
            if (el.selectionStart !== el.selectionEnd) { hideSuggestions(); return; }
            const tab = openTabs[activeTabIndex];
            if (!tab) { hideSuggestions(); return; }

            const fullSql = el.value;
            const before = fullSql.slice(0, el.selectionStart);
            const items = getSuggestCandidates(before, fullSql, tab);
            if (!items.length) { hideSuggestions(); return; }

            const dot = before.match(/([A-Za-z0-9_"]+)\.([A-Za-z0-9_]*)$/);
            const wm = before.match(/[A-Za-z0-9_]+$/);
            sugTokenStart = dot ? el.selectionStart - dot[2].length
                               : (wm ? el.selectionStart - wm[0].length : el.selectionStart);

            sugItems = items.slice(0, 10);
            sugIdx = 0;
            renderSuggestList();
            positionSuggestPopup(el);
            popup.classList.add('show');
        }

        function positionSuggestPopup(el) {
            const popup = document.getElementById('sqlSuggest');
            const section = el.closest('.sql-section');
            const coords = getCaretCoords(el, el.selectionStart);
            const style = getComputedStyle(el);
            const lineHeight = parseFloat(style.lineHeight) || parseFloat(style.fontSize) * 1.5;
            // 镜像div给出的是内容坐标系, 需减去滚动偏移才是可视位置
            let left = el.offsetLeft + coords.left - el.scrollLeft;
            let top = el.offsetTop + coords.top - el.scrollTop + lineHeight + 2;
            // 仅做左边缘防溢出; 垂直方向不钳制, 始终锚定光标下方
            // (候选条目增减导致弹层高度变化时位置保持稳定, 空间不足时延伸到结果区)
            const maxLeft = section.clientWidth - popup.offsetWidth - 8;
            if (left > maxLeft) left = Math.max(0, maxLeft);
            popup.style.left = Math.max(0, left) + 'px';
            popup.style.top = Math.max(el.offsetTop, top) + 'px';
        }

        function getCaretCoords(el, pos) {
            const div = document.createElement('div');
            const style = getComputedStyle(el);
            ['fontFamily', 'fontSize', 'fontWeight', 'lineHeight', 'letterSpacing',
             'padding', 'borderWidth', 'borderStyle', 'boxSizing', 'whiteSpace', 'overflowWrap'
            ].forEach(p => { div.style[p] = style[p]; });
            div.style.position = 'absolute';
            div.style.visibility = 'hidden';
            div.style.whiteSpace = 'pre-wrap';
            div.style.wordWrap = 'break-word';
            div.style.width = el.clientWidth + 'px';
            div.textContent = el.value.substring(0, pos);
            const span = document.createElement('span');
            span.textContent = el.value.substring(pos) || '.';
            div.appendChild(span);
            document.body.appendChild(div);
            const result = { top: span.offsetTop, left: span.offsetLeft };
            document.body.removeChild(div);
            return result;
        }

        // ==================== 查询结果在线编辑 ====================
        function escapeHtml(v) {
            return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // 从SQL中提取查询主表名 (SELECT ... FROM [schema.]table / DELETE FROM table)
        function extractQueryTable(sql) {
            const m = sql.match(/\bFROM\s+["`]?([A-Za-z0-9_\.]+)["`]?/i);
            if (!m) return null;
            const parts = m[1].split('.');
            return parts[parts.length - 1];  // 去掉schema前缀
        }

        // 根据SQL确定编辑上下文: 有主表且拿到主键才可编辑
        async function resolveEditCtx(connId, sql) {
            const table = extractQueryTable(sql);
            if (!table) return null;
            const pks = await ensureTablePk(connId, table);
            return { connId, table, pkColumns: pks };
        }

        function maybeNumber(v) {
            if (typeof v !== 'string' || !v.trim()) return v;
            const n = Number(v);
            return Number.isNaN(n) ? v : n;
        }

        async function ensureTablePk(connId, tableName) {
            const key = connId + ':' + tableName;
            if (tablePks[key] !== undefined) return tablePks[key];
            tablePks[key] = [];
            try {
                const res = await fetch(`/api/v1/metadata/table/describe?connectionId=${connId}&table=${encodeURIComponent(tableName)}`);
                const data = await res.json();
                if (data.success && Array.isArray(data.columns)) {
                    tablePks[key] = data.columns
                        .filter(c => c.COLUMN_KEY === 'PRI' || c.is_primary_key)
                        .map(c => c.COLUMN_NAME || c.column_name);
                }
            } catch (e) { /* 无主键则不提供编辑 */ }
            return tablePks[key];
        }

        function renderCellText(td, val) {
            // 同步 json 悬停标记 (编辑提交后调用)
            const isJson = isJsonValue(val);
            td.classList.toggle('json-cell', isJson);
            if (isJson) {
                td.dataset.json = val;
            } else {
                delete td.dataset.json;
            }
            if (val === null || val === undefined) {
                td.innerHTML = '<span class="null">NULL</span>';
            } else {
                td.textContent = val;
            }
        }

        function startCellEdit(td) {
            if (!editCtx || !editCtx.pkColumns.length || !lastResult) return;
            if (td.querySelector('input')) return;
            const col = td.dataset.col;
            if (editCtx.pkColumns.includes(col)) return;  // 主键列不可编辑
            const ri = parseInt(td.parentElement.dataset.ri);
            const row = lastResult.data[ri];
            const pkVals = {};
            for (const pk of editCtx.pkColumns) {
                if (row[pk] === null || row[pk] === undefined) {
                    showToast('该行主键包含 NULL, 无法定位记录进行编辑', "info");
                    return;
                }
                pkVals[pk] = row[pk];
            }
            const original = row[col];
            const isNull = original === null || original === undefined;
            td.innerHTML = '';
            const input = document.createElement('input');
            input.value = isNull ? '' : original;
            input.className = 'cell-edit-input';
            td.appendChild(input);
            input.focus();
            if (!isNull) input.select();

            let done = false;
            const finish = async (save) => {
                if (done) return;
                done = true;
                const newVal = input.value;
                if (!save || newVal === (isNull ? '' : String(original))) {
                    renderCellText(td, original);
                    return;
                }
                const valueToSend = newVal === '' ? null : maybeNumber(newVal);
                const info = document.getElementById('resultInfo');
                info.textContent = '保存中...';
                try {
                    const res = await fetch('/api/v1/table/update-cell', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            connectionId: editCtx.connId,
                            table: editCtx.table,
                            column: col,
                            value: valueToSend,
                            pk: pkVals
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        row[col] = valueToSend;
                        renderCellText(td, valueToSend);
                        info.textContent = `已保存 ${editCtx.table}.${col} (${data.affectedRows} 行)`;
                    } else {
                        renderCellText(td, original);
                        showToast('保存失败: ' + data.error, 'error');
                        info.textContent = '保存失败';
                    }
                } catch (e) {
                    renderCellText(td, original);
                    showToast('保存失败: ' + e.message, "info");
                    info.textContent = '保存失败';
                }
            };
            input.addEventListener('keydown', ev => {
                if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
                else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
            });
            input.addEventListener('blur', () => finish(true));
        }
        
        // 通过主键删除行 (仅标记，从UI移除，等待保存)
        function deleteRowById(ri) {
            if (!editCtx || !editCtx.pkColumns.length || !lastResult) {
                showToast('无法删除：该查询没有主键', "info");
                return;
            }
            const row = lastResult.data[ri];
            if (!row) return;
            
            // 检查主键是否有NULL
            for (const pk of editCtx.pkColumns) {
                if (row[pk] === null || row[pk] === undefined) {
                    showToast('该行主键包含 NULL, 无法定位记录', "info");
                    return;
                }
            }
            
            // 标记该行待删除
            if (!deletedRows.includes(ri)) {
                deletedRows.push(ri);
            }
            
            // 从UI移除该行
            const table = document.getElementById('resultContent').querySelector('table');
            if (table) {
                const tbody = table.querySelector('tbody');
                if (tbody && tbody.rows[ri]) {
                    tbody.rows[ri].remove();
                }
            }
            
            // 更新显示
            document.getElementById('resultInfo').textContent = '已标记 ' + deletedRows.length + ' 行待删除，点击保存生效';
        }
        
        // 保存所有修改 (包括删除)
        async function saveAllChanges() {
            if (!editCtx || deletedRows.length === 0) {
                showToast('没有需要保存的修改', "info");
                return;
            }
            
            const dbType = (connections[editCtx.connId] || {}).db_type;
            const qt = dbType === 'mysql' ? '`' : '"';
            const promises = [];
            
            // 为每个待删除的行构建DELETE语句
            deletedRows.forEach(function(ri) {
                const row = lastResult.data[ri];
                if (!row) return;
                
                const pkVals = {};
                for (const pk of editCtx.pkColumns) {
                    pkVals[pk] = row[pk];
                }
                
                let whereClause = '';
                for (const pk in pkVals) {
                    const val = pkVals[pk];
                    if (typeof val === 'number') {
                        whereClause += (whereClause ? ' AND ' : '') + qt + pk + qt + ' = ' + val;
                    } else {
                        whereClause += (whereClause ? ' AND ' : '') + qt + pk + qt + " = '" + String(val).replace(/'/g, "''") + "'";
                    }
                }
                const sql = 'DELETE FROM ' + qt + editCtx.table + qt + ' WHERE ' + whereClause;
                
                promises.push(fetch('/api/v1/query/execute', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({connectionId: editCtx.connId, sql: sql})
                }).then(function(r) { return r.json(); }));
            });
            
            const results = await Promise.all(promises);
            const errors = results.filter(function(r) { return !r.success; });
            
            if (errors.length > 0) {
                showToast('部分删除失败: ' + errors.map(function(e) { return e.error; }).join(', '), "info");
            } else {
                showToast('保存成功! ' + deletedRows.length + ' 行已删除', 'success');
            }
            
            // 清空标记并刷新
            deletedRows = [];
            const sqlEl = document.getElementById('sqlInput');
            executeQuery(sqlEl.value);
        }

        // 渲染查询结果
        // ==================== JSON 悬停查看器 ====================
        let jsonViewerEl = null;
        function isJsonValue(v) {
            if (typeof v !== 'string') return false;
            const t = v.trim();
            if (t.length > 100000) return false;
            if (!t.startsWith('{') && !t.startsWith('[')) return false;
            try { JSON.parse(t); return true; } catch (e) { return false; }
        }
        function showJsonViewer(td) {
            const raw = td.dataset.json;
            if (!raw) return;
            if (!jsonViewerEl) {
                jsonViewerEl = document.createElement('pre');
                jsonViewerEl.id = 'jsonViewer';
                document.body.appendChild(jsonViewerEl);
            }
            try {
                jsonViewerEl.textContent = JSON.stringify(JSON.parse(raw), null, 2);
            } catch (e) {
                jsonViewerEl.textContent = raw;
            }
            jsonViewerEl.style.display = 'block';
            const rect = td.getBoundingClientRect();
            const vw = window.innerWidth, vh = window.innerHeight;
            const w = jsonViewerEl.offsetWidth, h = jsonViewerEl.offsetHeight;
            let left = rect.right + 8, top = rect.top;
            if (left + w > vw - 8) left = Math.max(8, rect.left - w - 8);
            if (left + w > vw - 8) left = 8;
            if (top + h > vh - 8) top = Math.max(8, vh - h - 8);
            jsonViewerEl.style.left = left + 'px';
            jsonViewerEl.style.top = top + 'px';
        }
        function hideJsonViewer() {
            if (jsonViewerEl) jsonViewerEl.style.display = 'none';
        }
        document.addEventListener('mouseover', e => {
            const td = e.target.closest ? e.target.closest('.json-cell') : null;
            if (td && !(e.relatedTarget && td.contains(e.relatedTarget))) showJsonViewer(td);
        });
        document.addEventListener('mouseout', e => {
            const td = e.target.closest ? e.target.closest('.json-cell') : null;
            if (td && !(e.relatedTarget && td.contains(e.relatedTarget))) hideJsonViewer();
        });

        function renderQueryResult(result) {
            document.getElementById('resultCount').textContent = `${result.rowCount} 行`;
            document.getElementById('resultTime').textContent = `${result.executionMs}ms`;
            lastResult = { columns: result.columns, data: result.data };

            // 可编辑条件: 识别到主表、拿到主键, 且结果包含全部主键列
            const pkReady = !!(editCtx && editCtx.pkColumns.length
                && editCtx.pkColumns.every(pk => result.columns.includes(pk)));
            document.getElementById('resultInfo').textContent = (execSelectionUsed ? '▶ 选中执行 | ' : '')
                + (pkReady
                    ? `${editCtx.table} (双击单元格可编辑, 空值=NULL)`
                    : (editCtx && editCtx.pkColumns.length
                        ? '结果未包含完整主键列, 只读'
                        : '请选择表或输入SQL'));
            execSelectionUsed = false;

            if (!result.data || result.data.length === 0) {
                document.getElementById('resultContent').innerHTML = 
                    '<div class="empty-state"><div>查询结果为空</div></div>';
                return;
            }
            
            const editable = pkReady;
            let html = '<table class="data-table"><thead><tr>';
            result.columns.forEach(col => html += `<th>${escapeHtml(col)}</th>`);
            if (editable) html += '<th style="width:50px;">操作</th>';
            html += '</tr></thead><tbody>';
            
            result.data.forEach((row, ri) => {
                html += `<tr${editable ? ` data-ri="${ri}"` : ''}>`;
                result.columns.forEach(col => {
                    const val = row[col];
                    const isJson = isJsonValue(val);
                    const cellVal = (val === null || val === undefined)
                        ? '<span class="null">NULL</span>'
                        : escapeHtml(val);
                    const jsonAttr = isJson ? ` data-json="${escapeHtml(val)}"` : '';
                    if (editable) {
                        const cls = isJson ? 'editable json-cell' : 'editable';
                        html += `<td class="${cls}" data-col="${escapeHtml(col)}" title="双击编辑"${jsonAttr} ondblclick="startCellEdit(this)">${cellVal}</td>`;
                    } else if (val === null || val === undefined) {
                        html += '<td class="null">NULL</td>';
                    } else if (isJson) {
                        html += `<td class="json-cell"${jsonAttr}>${cellVal}</td>`;
                    } else {
                        html += `<td>${cellVal}</td>`;
                    }
                });
                if (editable) {
                    html += '<td><button class="btn btn-danger btn-xs" onclick="deleteRowById(' + ri + ')" title="删除">🗑</button></td>';
                }
                html += '</tr>';
            });
            html += '</tbody></table>';
            
            document.getElementById('resultContent').innerHTML = html;
        }
        
        // 清空SQL
        function clearSQL() {
            document.getElementById('sqlInput').value = '';
        }
        
        // 显示表结构
        // ==================== 字段添加/修改/删除 ====================
        const COLUMN_TYPES = {
            mysql: ['INT', 'BIGINT', 'TINYINT', 'SMALLINT', 'VARCHAR', 'CHAR', 'TEXT', 'DECIMAL', 'FLOAT', 'DOUBLE', 'DATE', 'DATETIME', 'TIMESTAMP', 'TIME', 'BOOLEAN', 'JSON', 'BLOB'],
            postgresql: ['INTEGER', 'BIGINT', 'SMALLINT', 'VARCHAR', 'CHAR', 'TEXT', 'NUMERIC', 'REAL', 'DOUBLE PRECISION', 'DATE', 'TIMESTAMP', 'TIMESTAMPTZ', 'TIME', 'BOOLEAN', 'JSONB', 'UUID', 'BYTEA']
        };
        // information_schema 的 data_type -> 下拉选项归一化
        const TYPE_ALIAS = {
            'CHARACTER VARYING': 'VARCHAR', 'VARCHAR': 'VARCHAR', 'CHARACTER': 'CHAR', 'BPCHAR': 'CHAR', 'CHAR': 'CHAR',
            'INT': 'INT', 'INTEGER': 'INTEGER', 'INT4': 'INTEGER', 'MEDIUMINT': 'INT',
            'BIGINT': 'BIGINT', 'INT8': 'BIGINT', 'SMALLINT': 'SMALLINT', 'INT2': 'SMALLINT', 'TINYINT': 'TINYINT',
            'NUMERIC': 'NUMERIC', 'DECIMAL': 'DECIMAL',
            'DOUBLE PRECISION': 'DOUBLE PRECISION', 'DOUBLE': 'DOUBLE', 'REAL': 'REAL', 'FLOAT': 'FLOAT', 'FLOAT4': 'REAL', 'FLOAT8': 'DOUBLE PRECISION',
            'TIMESTAMP WITHOUT TIME ZONE': 'TIMESTAMP', 'TIMESTAMP WITH TIME ZONE': 'TIMESTAMPTZ',
            'TIMESTAMP': 'TIMESTAMP', 'DATETIME': 'DATETIME', 'DATE': 'DATE', 'TIME': 'TIME',
            'BOOLEAN': 'BOOLEAN', 'BOOL': 'BOOLEAN',
            'TEXT': 'TEXT', 'JSON': 'JSON', 'JSONB': 'JSONB', 'UUID': 'UUID', 'BYTEA': 'BYTEA', 'BLOB': 'BLOB'
        };
        let structureColumns = [];  // 当前表结构的字段列表 (供修改/删除按索引引用)
        let structureIndexes = [];  // 当前表的索引列表 (供删除按索引引用)
        let colEditOld = null;      // null=添加字段, 否则为被编辑的原始字段行

        function showColumnModal(idx) {
            const tab = openTabs[activeTabIndex];
            if (!tab) return;
            colEditOld = (idx === null || idx === undefined) ? null : structureColumns[idx];
            const dbType = (connections[tab.connId] || {}).db_type || 'postgresql';
            const types = COLUMN_TYPES[dbType] || COLUMN_TYPES.postgresql;
            const sel = document.getElementById('colEditType');

            let curType = '', curName = '', curLength = '', curDefault = '', curComment = '', curNotNull = false, curExtra = '';
            if (colEditOld) {
                curName = colEditOld.COLUMN_NAME || colEditOld.column_name || '';
                curType = String(colEditOld.DATA_TYPE || colEditOld.data_type || '').toUpperCase();
                curLength = colEditOld.length == null ? '' : String(colEditOld.length);
                curDefault = colEditOld.COLUMN_DEFAULT ?? colEditOld.column_default ?? '';
                curComment = colEditOld.COLUMN_COMMENT || colEditOld.column_comment || '';
                curNotNull = (colEditOld.IS_NULLABLE || colEditOld.is_nullable) === 'NO';
                curExtra = colEditOld.EXTRA || colEditOld.extra || '';
            }
            // 当前类型不在下拉列表时原样追加为选项, 保证保存不破坏原类型
            const selected = TYPE_ALIAS[curType] || curType;
            const options = selected && types.includes(selected) ? types : [selected, ...types];
            sel.innerHTML = options.map(t => `<option value="${t}" ${t === selected ? 'selected' : ''}>${t}</option>`).join('');

            document.getElementById('columnModalTitle').textContent = colEditOld ? `修改字段: ${curName}` : '添加字段';
            document.getElementById('colEditName').value = curName;
            document.getElementById('colEditLength').value = curLength;
            document.getElementById('colEditDefault').value = curDefault;
            document.getElementById('colEditComment').value = curComment;
            document.getElementById('colEditNotNull').checked = curNotNull;
            document.getElementById('colEditInfo').textContent = colEditOld
                ? '提示: 默认值保持原样时不会改动它 (保护 nextval 等序列默认)'
                : '提示: 类型下拉选基底类型, 长度单独填 (如 VARCHAR + 100, DECIMAL + 10,2)';
            document.getElementById('columnModal').classList.add('show');
        }

        function closeColumnModal() {
            document.getElementById('columnModal').classList.remove('show');
        }

        async function saveColumn() {
            const tab = openTabs[activeTabIndex];
            if (!tab) return;
            const name = document.getElementById('colEditName').value.trim();
            const type = document.getElementById('colEditType').value;
            const length = document.getElementById('colEditLength').value.trim();
            const defVal = document.getElementById('colEditDefault').value;
            const comment = document.getElementById('colEditComment').value;
            const notNull = document.getElementById('colEditNotNull').checked;
            if (!name) { showToast('请输入字段名', "info"); return; }
            if (!type) { showToast('请选择类型', "info"); return; }

            const spec = { name, type, length: length || null, not_null: notNull, default: defVal, comment };
            let url, body;
            if (colEditOld) {
                const origName = colEditOld.COLUMN_NAME || colEditOld.column_name;
                const origDefault = colEditOld.COLUMN_DEFAULT ?? colEditOld.column_default;
                spec.default_same = String(defVal) === String(origDefault ?? '');
                spec.original_default = origDefault;
                spec.extra = colEditOld.EXTRA || colEditOld.extra || '';
                url = '/api/v1/table/modify-column';
                body = { connectionId: tab.connId, table: tab.tableName, oldName: origName, column: spec };
            } else {
                url = '/api/v1/table/add-column';
                body = { connectionId: tab.connId, table: tab.tableName, column: spec };
            }
            try {
                const res = await fetch(url, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) {
                    closeColumnModal();
                    showStructure();  // 刷新表结构
                } else {
                    showToast('保存失败: ' + data.error, 'error');
                }
            } catch (e) {
                showToast('保存失败: ' + e.message, "info");
            }
        }

        function dropColumnConfirm(idx) {
            const col = structureColumns[idx];
            if (!col) return;
            const name = col.COLUMN_NAME || col.column_name;
            showConfirmModal(`确定删除字段 ${name} 吗? 该操作不可恢复!`, async () => {
                const tab = openTabs[activeTabIndex];
                if (!tab) return;
                try {
                    const res = await fetch('/api/v1/table/drop-column', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ connectionId: tab.connId, table: tab.tableName, column: name })
                    });
                    const data = await res.json();
                    if (data.success) showStructure();
                    else showToast('删除失败: ' + data.error, 'error');
                } catch (e) {
                    showToast('删除失败: ' + e.message, "info");
                }
            });
        }

        // ==================== 索引新建/删除 ====================
        function showIndexModal() {
            const tab = openTabs[activeTabIndex];
            if (!tab) return;
            if (!structureColumns.length) { showToast('请先加载表结构', "info"); return; }
            const dbType = (connections[tab.connId] || {}).db_type || 'postgresql';
            const methods = dbType === 'mysql'
                ? [['', '默认'], ['BTREE', 'BTREE'], ['HASH', 'HASH'], ['FULLTEXT', 'FULLTEXT']]
                : [['', '默认 (btree)'], ['btree', 'BTREE'], ['hash', 'HASH'], ['gin', 'GIN'], ['gist', 'GiST'], ['brin', 'BRIN']];
            document.getElementById('idxMethod').innerHTML =
                methods.map(m => `<option value="${m[0]}">${m[1]}</option>`).join('');
            document.getElementById('idxName').value = '';
            document.getElementById('idxUnique').checked = false;
            document.getElementById('idxColumnList').innerHTML = structureColumns.map(col => {
                const n = col.COLUMN_NAME || col.column_name;
                return `<div class="idx-col-row">
                    <label style="display:flex;align-items:center;gap:6px;flex:1;cursor:pointer;">
                        <input type="checkbox" class="idx-col" value="${escapeHtml(n)}"
                               onchange="this.closest('.idx-col-row').querySelector('.idx-dir').disabled = !this.checked">
                        ${escapeHtml(n)}
                    </label>
                    <select class="idx-dir" disabled>
                        <option value="ASC">ASC</option>
                        <option value="DESC">DESC</option>
                    </select>
                </div>`;
            }).join('');

        function closeIndexModal() {
            document.getElementById('indexModal').classList.remove('show');
        }

        async function saveIndex() {
            const tab = openTabs[activeTabIndex];
            if (!tab) return;
            const cols = [];
            document.querySelectorAll('#idxColumnList .idx-col-row').forEach(row => {
                const cb = row.querySelector('.idx-col');
                if (cb.checked) cols.push({ name: cb.value, dir: row.querySelector('.idx-dir').value });
            });
            if (!cols.length) { showToast('请至少勾选一个索引字段', "info"); return; }
            const body = {
                connectionId: tab.connId,
                table: tab.tableName,
                index: {
                    name: document.getElementById('idxName').value.trim(),
                    unique: document.getElementById('idxUnique').checked,
                    method: document.getElementById('idxMethod').value,
                    columns: cols
                }
            };
            try {
                const res = await fetch('/api/v1/table/create-index', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) {
                    closeIndexModal();
                    showStructure();
                } else {
                    showToast('创建失败: ' + data.error, 'error');
                }
            } catch (e) {
                showToast('创建失败: ' + e.message, "info");
            }
        }

            try {

                        html += `

                            <td>${col.COLUMN_KEY || (col.is_primary_key ? 'PRI' : '')}</td>
                            <td>${escapeHtml(String(col.COLUMN_DEFAULT ?? col.column_default ?? '-'))}</td>

                    html += '</tbody></table></div>';
                    
                    // 索引信息
                    structureIndexes = data.indexes || [];
                    html += '<div class="structure-section scrollable"><h4>索引信息 '

                                <td>${escapeHtml(idx.INDEX_TYPE || '')}</td>
                                <td>${escapeHtml(idx.COLUMNS || idx.indexdef || '')}</td>

                            </tr>`;

                    html += '</div>';
                    
                    // 外键信息
                    if (data.foreignKeys && data.foreignKeys.length > 0) {
                        html += '<div class="structure-section scrollable"><h4>外键信息</h4><table class="structure-table"><thead><tr><th>外键名</th><th>字段</th><th>关联表</th><th>关联字段</th></tr></thead><tbody>';

                }

                console.error(e);
            }
        }

        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ==================== 连接管理 ====================
        
        function showConnectionModal(connId = null) {
            document.getElementById('connectionModal').classList.add('show');
            document.getElementById('connectionModalTitle').textContent = connId ? '编辑连接' : '新建连接';
            document.getElementById('editConnId').value = connId || '';
            
            if (connId && connections[connId]) {
                const conn = connections[connId];
                document.getElementById('connName').value = conn.name;
                document.getElementById('dbType').value = conn.db_type;
                document.getElementById('connMode').value = conn.mode || 'direct';
                document.getElementById('dbHost').value = conn.host;
                document.getElementById('dbPort').value = conn.port;
                document.getElementById('dbUser').value = conn.username;
                document.getElementById('dbPassword').value = conn.password || '';
                document.getElementById('dbName').value = conn.database_name;
                document.getElementById('dbCharset').value = conn.charset || 'utf8mb4';
                document.getElementById('connGroup').value = conn.group_name || '默认';
                document.getElementById('connRemark').value = conn.remark || '';
                
                // SSH
                document.getElementById('sshHost').value = conn.ssh_host || '';
                document.getElementById('sshPort').value = conn.ssh_port || 22;
                document.getElementById('sshUser').value = conn.ssh_username || '';
                document.getElementById('sshAuthType').value = conn.ssh_auth_type || 'password';
                document.getElementById('sshPassword').value = conn.ssh_password || '';
                document.getElementById('sshPrivateKey').value = conn.ssh_private_key || '';
                document.getElementById('sshKeyPassphrase').value = conn.ssh_key_passphrase || '';
            }
            
            updateDefaultPort();
            toggleConnectionMode();
        }
        
        function closeConnectionModal() {
            document.getElementById('connectionModal').classList.remove('show');
        }
        
        function updateDefaultPort() {
            const dbType = document.getElementById('dbType').value;
            const ports = {mysql: 3306, postgresql: 5432, redis: 6379, mongodb: 27017};
            document.getElementById('dbPort').value = ports[dbType] || 3306;
            
            // Redis/MongoDB 不需要用户名和数据库名, 调整表单提示
            const isRedis = dbType === 'redis';
            const isMongo = dbType === 'mongodb';
            document.getElementById('userLabel').textContent = (isRedis || isMongo) ? '用户名 (可选)' : '用户名 *';
            document.getElementById('dbLabel').textContent = (isRedis || isMongo) ? '库编号 (可选)' : '数据库名 *';
            document.getElementById('dbUser').placeholder = isRedis ? '默认不填' : (isMongo ? '可选' : 'root');
            document.getElementById('dbName').placeholder = isRedis ? '0' : (isMongo ? '可选' : 'test');
            document.getElementById('charsetGroup').style.display = (isRedis || isMongo) ? 'none' : '';
        }
        
        function toggleConnectionMode() {
            const mode = document.getElementById('connMode').value;
            document.getElementById('sshSection').style.display = mode === 'ssh' ? 'block' : 'none';
        }
        
        function toggleSshAuth() {
            const authType = document.getElementById('sshAuthType').value;
            document.getElementById('sshPasswordRow').style.display = authType === 'password' ? 'flex' : 'none';
            document.getElementById('sshKeyRow').style.display = authType === 'key' ? 'flex' : 'none';
        }
        
        async function testConnection() {
            const data = getConnectionFormData();
            
            try {
                const res = await fetch('/api/v1/connections/test', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if (result.success) {
                    showToast(`✅ 连接成功！\n版本: ${result.serverVersion}\n延迟: ${result.latencyMs}ms`, "info");
                } else {
                    showToast(`❌ 连接失败: ${result.message}`, "info");
                }
            } catch(e) {
                showToast('测试失败: ' + e.message, "info");
            }
        }
        
        function getConnectionFormData() {
            return {
                name: document.getElementById('connName').value,
                db_type: document.getElementById('dbType').value,
                mode: document.getElementById('connMode').value,
                host: document.getElementById('dbHost').value,
                port: parseInt(document.getElementById('dbPort').value),
                username: document.getElementById('dbUser').value,
                password: document.getElementById('dbPassword').value,
                database_name: document.getElementById('dbName').value,
                charset: document.getElementById('dbCharset').value,
                group_name: document.getElementById('connGroup').value,
                remark: document.getElementById('connRemark').value,
                ssh_host: document.getElementById('sshHost').value,
                ssh_port: parseInt(document.getElementById('sshPort').value),
                ssh_username: document.getElementById('sshUser').value,
                ssh_auth_type: document.getElementById('sshAuthType').value,
                ssh_password: document.getElementById('sshPassword').value,
                ssh_private_key: document.getElementById('sshPrivateKey').value,
                ssh_key_passphrase: document.getElementById('sshKeyPassphrase').value
            };
        }
        
        async function saveConnection() {
            const data = getConnectionFormData();
            
            // Redis/MongoDB: 用户名和数据库名可选; SQL数据库: 必填用户名, 数据库名可选(可后续创建)
            const isRedis = data.db_type === 'redis';
            const isMongo = data.db_type === 'mongodb';
            if (!data.name || !data.host) {
                showToast('请填写必填字段', "info");
                return;
            }
            // SQL数据库只需要用户名, 数据库名可选(可以连接后创建)
            if (!isRedis && !isMongo && !data.username) {
                showToast('请填写必填字段', "info");
                return;
            }
            
            const connId = document.getElementById('editConnId').value;
            const url = connId ? `/api/v1/connections/${connId}` : '/api/v1/connections';
            const method = connId ? 'PUT' : 'POST';
            
            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if (result.success) {
                    closeConnectionModal();
                    await loadConnections();
                    showToast('保存成功!', 'success');
                } else {
                    showToast('保存失败: ' + result.error, 'error');
                }
            } catch(e) {
                showToast('保存失败: ' + e.message, 'error');
            }
        }
        
        function editConnection(connId) {
            showConnectionModal(connId);
        }
        
        async function deleteConnection(connId) {
            showConfirmModal('确定要删除这个连接吗？', async () => {
                try {
                    const res = await fetch(`/api/v1/connections/${connId}`, { method: 'DELETE' });
                    const data = await res.json();
                    
                    if (data.success) {
                        delete activeConnections[connId];
                        await loadConnections();
                    } else {
                        showToast('删除失败: ' + data.error, 'error');
                    }
                } catch(e) {
                    showToast('删除失败: ' + e.message, "info");
                }
            });
        }
        
        // ==================== 新建表 ====================
        
        let currentCreateConnId = null;
        
        function showCreateTableModal(connId) {
            currentCreateConnId = connId || currentConnId;
            document.getElementById('createTableModal').classList.add('show');
            document.getElementById('newTableName').value = '';
            document.getElementById('newTableComment').value = '';
            document.getElementById('columnList').innerHTML = `
                <div class="column-item">
                    <input type="text" class="col-name" placeholder="字段名" style="width: 100px;">
                    <select class="col-type">
                        <option value="INT">INT</option>
                        <option value="BIGINT">BIGINT</option>
                        <option value="VARCHAR(255)">VARCHAR(255)</option>
                        <option value="TEXT">TEXT</option>
                        <option value="DATETIME">DATETIME</option>
                        <option value="DECIMAL(10,2)">DECIMAL(10,2)</option>
                        <option value="BOOLEAN">BOOLEAN</option>
                    </select>
                    <label><input type="checkbox" class="col-pk"> 主键</label>
                    <label><input type="checkbox" class="col-ai"> 自增</label>
                    <label><input type="checkbox" class="col-null" checked> 可空</label>
                    <input type="text" class="col-default" placeholder="默认值" style="width: 70px;">
                    <input type="text" class="col-comment" placeholder="注释" style="width: 80px;">
                    <button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">×</button>
                </div>
            `;
            document.getElementById('ddlPreviewSection').style.display = 'none';
        }
        
        function closeCreateTableModal() {
            document.getElementById('createTableModal').classList.remove('show');
        }
        
        function addColumn() {
            const div = document.createElement('div');
            div.className = 'column-item';
            div.innerHTML = `
                <input type="text" class="col-name" placeholder="字段名" style="width: 100px;">
                <select class="col-type">
                    <option value="INT">INT</option>
                    <option value="BIGINT">BIGINT</option>
                    <option value="VARCHAR(255)">VARCHAR(255)</option>
                    <option value="TEXT">TEXT</option>
                    <option value="DATETIME">DATETIME</option>
                    <option value="DECIMAL(10,2)">DECIMAL(10,2)</option>
                    <option value="BOOLEAN">BOOLEAN</option>
                </select>
                <label><input type="checkbox" class="col-pk"> 主键</label>
                <label><input type="checkbox" class="col-ai"> 自增</label>
                <label><input type="checkbox" class="col-null" checked> 可空</label>
                <input type="text" class="col-default" placeholder="默认值" style="width: 70px;">
                <input type="text" class="col-comment" placeholder="注释" style="width: 80px;">
                <button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('columnList').appendChild(div);
        }
        
        async function previewDDL() {
            const tableName = document.getElementById('newTableName').value.trim();
            const comment = document.getElementById('newTableComment').value;
            
            if (!tableName) {
                showToast('请输入表名', "info");
                return;
            }
            
            const columns = [];
            document.querySelectorAll('.column-item').forEach(item => {
                const name = item.querySelector('.col-name').value.trim();
                const type = item.querySelector('.col-type').value;
                if (name) {
                    columns.push({
                        name: name,
                        type: type,
                        primary_key: item.querySelector('.col-pk').checked,
                        auto_increment: item.querySelector('.col-ai').checked,
                        nullable: item.querySelector('.col-null').checked,
                        default: item.querySelector('.col-default').value || null,
                        comment: item.querySelector('.col-comment').value || ''
                    });
                }
            });
            
            if (columns.length === 0) {
                showToast('请至少添加一个字段', "info");
                return;
            }
            
            try {
                const res = await fetch('/api/v1/table/preview-ddl', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        connectionId: currentCreateConnId,
                        tableName: tableName,
                        columns: columns,
                        comment: comment
                    })
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('ddlPreview').textContent = data.ddl;
                    document.getElementById('ddlPreviewSection').style.display = 'block';
                } else {
                    showToast('生成DDL失败: ' + data.error, "info");
                }
            } catch(e) {
                showToast('生成DDL失败: ' + e.message, "info");
            }
        }
        
        async function createTable() {
            const tableName = document.getElementById('newTableName').value.trim();
            const comment = document.getElementById('newTableComment').value;
            
            if (!tableName) {
                showToast('请输入表名', "info");
                return;
            }
            
            const columns = [];
            document.querySelectorAll('.column-item').forEach(item => {
                const name = item.querySelector('.col-name').value.trim();
                const type = item.querySelector('.col-type').value;
                if (name) {
                    columns.push({
                        name: name,
                        type: type,
                        primary_key: item.querySelector('.col-pk').checked,
                        auto_increment: item.querySelector('.col-ai').checked,
                        nullable: item.querySelector('.col-null').checked,
                        default: item.querySelector('.col-default').value || null,
                        comment: item.querySelector('.col-comment').value || ''
                    });
                }
            });
            
            if (columns.length === 0) {
                showToast('请至少添加一个字段', "info");
                return;
            }
            
            try {
                const res = await fetch('/api/v1/table/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        connectionId: currentCreateConnId,
                        tableName: tableName,
                        columns: columns,
                        comment: comment
                    })
                });
                const data = await res.json();
                
                if (data.success) {
                    showToast('表创建成功！', "info");
                    closeCreateTableModal();
                    refreshObjects(currentCreateConnId);
                } else {
                    showToast('创建失败: ' + data.error, 'error');
                }
            } catch(e) {
                showToast('创建失败: ' + e.message, "info");
            }
        }
        
        // ==================== 确认对话框 ====================
        
        let confirmCallback = null;
        
        function showConfirmModal(message, callback) {
            document.getElementById('confirmText').textContent = message;
            confirmCallback = callback;
            document.getElementById('confirmModal').classList.add('show');
        }
        
        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
            confirmCallback = null;
        }
        
        function confirmAction() {
            if (confirmCallback) {
                confirmCallback();
            }
            closeConfirmModal();
        }
        
        // 快捷键
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                if (document.getElementById('sqlInput').document.activeElement) {
                    executeSQL();
                }
            }
        });
        
        // ==================== 主题切换 ====================
        const THEME_KEY = 'pyndb_theme';
        function applyTheme() {
            const pref = localStorage.getItem(THEME_KEY) || 'auto';
            const dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            const sel = document.getElementById('themeSelect');
            if (sel && sel.value !== pref) sel.value = pref;
        }
        function initTheme() {
            const sel = document.getElementById('themeSelect');
            if (sel) {
                sel.value = localStorage.getItem(THEME_KEY) || 'auto';
                sel.addEventListener('change', () => {
                    localStorage.setItem(THEME_KEY, sel.value);
                    applyTheme();
                });
            }
            const mq = window.matchMedia('(prefers-color-scheme: dark)');
            if (mq.addEventListener) mq.addEventListener('change', applyTheme);
            applyTheme();
        }

        // 初始化
        init();
        initTheme();
    </script>
